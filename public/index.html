<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Server Manager — Discord Bot Hub</title>
  <meta name="description"
    content="High-performance Minecraft Server Management Dashboard, Discord Control Hub, and Live Telemetry." />

  <!-- Brand Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />

  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Modern SaaS Theme Stylesheets -->
  <link rel="stylesheet" href="/css/theme.css?v=5.0" />
  <link rel="stylesheet" href="/css/components.css?v=5.0" />
</head>

<body>
  <div class="app-container">
    <!-- Reactive Navbar & Header Component -->
    <div id="navbar-container"></div>

    <!-- Main View Component Mounts -->
    <main id="main-content">
      <div id="tab-overview" class="tab-content active"></div>
      <div id="tab-members" class="tab-content"></div>
      <div id="tab-logs" class="tab-content"></div>
      <div id="tab-access" class="tab-content"></div>
      <div id="tab-login" class="tab-content"></div>
    </main>

    <!-- Clean Footer -->
    <footer class="app-footer" style="padding: 1.5rem 0; text-align: center; font-size: 0.8125rem; color: var(--text-muted); border-top: 1px solid var(--border-default); margin-top: 2rem;">
      <div style="font-weight: 500;">Minecraft Server Manager &bull; Discord Bot Hub &copy; 2026</div>
    </footer>
  </div>

  <!-- Toast Notification Mount -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modular Lightweight JavaScript Bootstrap -->
  <script type="module" src="/js/app.js?v=5.0"></script>
</body>

</html>
